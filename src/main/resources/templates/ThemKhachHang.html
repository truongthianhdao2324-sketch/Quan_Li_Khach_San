<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khách Hàng Mới - Kênh Lễ Tân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff9fa; color: #5c5055; }
        .sidebar { width: 300px; background-color: #fde2e4; color: #6b4c58; padding: 30px 20px; box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4); }
        .sidebar h2 { font-size: 19px; margin-top: 15px; margin-bottom: 40px; color: #593945; }
        .sidebar .nav-link { color: #6b4c58; padding: 12px 18px; border-radius: 12px; margin-bottom: 12px; font-weight: 600; gap: 12px; transition: all 0.3s ease; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #ff758c; color: #ffffff; transform: translateX(4px); box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3); }
        .main-content { padding: 40px; }
        .page-title { font-size: 26px; color: #593945; }
        .form-card { max-width: 760px; background-color: #ffffff; padding: 32px; border-radius: 20px; box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6); border: 1px solid #fae1dd; margin-top: 25px; }
        .form-label { font-weight: 600; color: #593945; font-size: 14px; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 12px; padding: 11px 14px; border: 1px solid #fae1dd; color: #5c5055; }
        .form-control:focus, .form-select:focus { border-color: #ff758c; box-shadow: 0 0 0 0.2rem rgba(255, 117, 140, 0.2); }
        .btn-pink { background-color: #ff758c; color: #ffffff; border: none; border-radius: 12px; padding: 11px 24px; font-weight: 600; box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3); }
        .btn-pink:hover { background-color: #ff5c77; color: #ffffff; }
        .btn-cancel-pink { background-color: #fff0f3; color: #6b4c58; border: 1px solid #fae1dd; border-radius: 12px; padding: 11px 22px; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body class="d-flex vh-100 overflow-hidden m-0 p-0">

<aside class="sidebar d-flex flex-column flex-shrink-0">
    <h2 class="fw-bold text-center">🌸 KÊNH LỄ TÂN</h2>
    <nav class="nav flex-column flex-grow-1">
        <a class="nav-link d-flex align-items-center" th:href="@{/letan/dashboard}">🏠 Trang chủ Lễ tân</a>
        <a class="nav-link active d-flex align-items-center" th:href="@{/khachhang/danhsach}">👥 Quản lý Khách hàng</a>
        <a class="nav-link d-flex align-items-center" th:href="@{/khachhang/phong}">🛏️ Quản lý Phòng</a>
        <a class="nav-link d-flex align-items-center" th:href="@{/hoadon/danhsach}">🧾 Quản lý Hóa đơn</a>
        <a class="nav-link d-flex align-items-center mt-auto mb-0" style="color: #ff4d6d;" th:href="@{/dang-nhap}">Đăng xuất</a>
    </nav>
</aside>

<main class="main-content flex-grow-1 overflow-auto">
    <h1 class="fw-bold page-title m-0">Thêm Hồ Sơ Khách Hàng Mới</h1>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mt-3" style="max-width: 760px;">
        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="form-card">
        <form th:action="@{/khachhang/them}" th:object="${khachHang}" method="post">
            <div class="mb-3">
                <label class="form-label">Loại Giấy Tờ</label>
                <select th:field="*{loaiGiayTo}" class="form-select">
                    <option value="CCCD">CCCD</option>
                    <option value="CMND">CMND</option>
                    <option value="Hộ chiếu">Hộ chiếu</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Số Giấy Tờ <span class="text-danger">*</span></label>
                <input type="text" th:field="*{soGiayTo}" class="form-control" required
                       placeholder="Nhập số giấy tờ định danh (9 hoặc 12 chữ số)...">
            </div>
            <div class="mb-3">
                <label class="form-label">Họ và Tên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{hoTen}" class="form-control" required
                       placeholder="Nhập họ tên khách hàng...">
            </div>
            <div class="mb-3">
                <label class="form-label">Giới Tính</label>
                <select th:field="*{gioiTinh}" class="form-select">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Số Điện Thoại <span class="text-danger">*</span></label>
                <input type="text" th:field="*{soDienThoai}" class="form-control" required
                       placeholder="Nhập số điện thoại (10 số, bắt đầu bằng 0)...">
            </div>
            <div class="mb-4">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       placeholder="Nhập địa chỉ email...">
            </div>

            <div class="d-flex align-items-center gap-2">
                <button type="submit" class="btn btn-pink">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Hồ Sơ Khách Hàng
                </button>
                <a th:href="@{/khachhang/danhsach}" class="btn-cancel-pink">Hủy bỏ</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
