<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Thông Tin Khách Hàng</title>

    <style>
        /* --- RESET & STYLE CHUNG --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9fa;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #5c5055;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: #fde2e4;
            color: #6b4c58;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 40px;
            color: #593945;
        }

        .sidebar a {
            color: #6b4c58;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #ff758c;
            color: white;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title h1 {
            font-size: 26px;
            color: #593945;
            margin: 0;
            font-weight: 700;
        }

        /* --- KHUNG FORM CHỈNH SỬA --- */
        .card {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6);
            border: 1px solid #fae1dd;
            margin-top: 25px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #593945;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #fae1dd;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fffafb;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff758c;
        }

        /* Nút lưu thay đổi */
        .btn-submit {
            background-color: #ff758c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        .btn-submit:hover {
            background-color: #ff5c77;
        }

        /* Nút hủy quay lại */
        .btn-back {
            background-color: #fce4ec;
            color: #6b4c58;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-left: 10px;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #f8bbd0;
        }
    </style>
</head>
<body>

<!-- SIDEBAR ĐIỀU HƯỚNG -->
<div class="sidebar">
    <h2>🌸 KÊNH LỄ TÂN</h2>

    <a th:href="@{/letan/dashboard}">
        🏠 Trang chủ Lễ tân
    </a>

    <a th:href="@{/khachhang/danhsach}" class="active">
        👥 Quản lý Khách hàng
    </a>

    <a th:href="@{/khachhang/phong}">
        🛏️ Quản lý Phòng
    </a>

    <a th:href="@{/dang-nhap}" style="margin-top: auto; color: #ff4d6d;">
        Đăng xuất
    </a>
</div>

<!-- KHUNG NỘI DUNG CHÍNH -->
<div class="main-content">

    <div class="header-title">
        <h1>Chỉnh Sửa Thông Tin Khách Hàng</h1>
    </div>

    <div class="card">

        <!-- Form gửi dữ liệu cập nhật về Controller -->
        <form th:action="@{/khachhang/cap-nhat}" th:object="${khachHang}" method="post">

            <!-- Trường ẩn giữ lại số giấy tờ (khóa chính) để hệ thống nhận diện bản ghi cần sửa -->
            <input type="hidden" th:field="*{soGiayTo}" />

            <!-- Chọn loại giấy tờ -->
            <div class="form-group">
                <label>Loại Giấy Tờ</label>
                <select th:field="*{loaiGiayTo}">
                    <option value="CCCD">CCCD</option>
                    <option value="CMND">CMND</option>
                    <option value="Hộ chiếu">Hộ chiếu</option>
                </select>
            </div>

            <!-- Số giấy tờ hiển thị (khóa chính không cho phép sửa đổi trực tiếp) -->
            <div class="form-group">
                <label>Số Giấy Tờ (Mã định danh)</label>
                <input type="text" th:field="*{soGiayTo}" disabled style="background-color: #f5f5f5; color: #888;" />
            </div>

            <!-- Nhập họ và tên -->
            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" th:field="*{hoTen}" required />
            </div>

            <!-- Chọn giới tính -->
            <div class="form-group">
                <label>Giới Tính</label>
                <select th:field="*{gioiTinh}">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>

            <!-- Nhập số điện thoại -->
            <div class="form-group">
                <label>Số Điện Thoại</label>
                <input type="text" th:field="*{soDienThoai}" required />
            </div>

            <!-- Nhập email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" />
            </div>

            <!-- Khu vực nút bấm thao tác -->
            <div style="margin-top: 25px;">
                <button type="submit" class="btn-submit">
                    💾 Lưu Thay Đổi
                </button>

                <a th:href="@{/khachhang/danhsach}" class="btn-back">
                    Hủy bỏ
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
