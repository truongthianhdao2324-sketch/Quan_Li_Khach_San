<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm phòng</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9fa;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            color: #5c5055;
        }

        .sidebar {
            width: 260px;
            background-color: #fde2e4;
            color: #6b4c58;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 40px;
            color: #593945;
        }

        .sidebar a {
            color: #6b4c58;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #ff758c;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title h1 {
            font-size: 26px;
            color: #593945;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6);
            border: 1px solid #fae1dd;
            margin-top: 25px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #593945;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #fae1dd;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fffafb;
            outline: none;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-submit {
            background-color: #ff758c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-back {
            background-color: #fce4ec;
            color: #6b4c58;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-left: 10px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>🌸 KÊNH LỄ TÂN</h2>
    <a th:href="@{/letan/dashboard}">🏠 Trang chủ Lễ tân</a>
    <a th:href="@{/khachhang/danhsach}">👥 Quản lý Khách hàng</a>
    <a th:href="@{/khachhang/phong}" class="active">🛏️ Quản lý Phòng</a>
    <a th:href="@{/hoadon/danhsach}">🧾 Quản lý Hóa đơn</a>
    <a th:href="@{/dang-nhap}" style="margin-top: auto; color: #ff4d6d;">Đăng xuất</a>
</div>

<div class="main-content">
    <div class="header-title">
        <h1>Thêm Phòng Mới</h1>
    </div>

    <div class="card">
        <form th:action="@{/khachhang/phong/them}"
              th:object="${room}" method="post">

            <div class="form-group">
                <label>Số Phòng</label>
                <input type="text" th:field="*{soPhong}"
                       placeholder="Nhập số phòng..." maxlength="20"
                       required>
                <div class="error" th:if="${#fields.hasErrors('soPhong')}"
                     th:errors="*{soPhong}"></div>
            </div>

            <div class="form-group">
                <label>Giá Phòng (VNĐ)</label>
                <input type="number" th:field="*{giaPhong}"
                       min="1" step="0.01" placeholder="Nhập giá phòng..."
                       required>
                <div class="error" th:if="${#fields.hasErrors('giaPhong')}"
                     th:errors="*{giaPhong}"></div>
            </div>

            <div class="form-group">
                <label>Loại Phòng</label>
                <select th:field="*{loaiPhong}" required>
                    <option value="">-- Chọn loại phòng --</option>
                    <option th:each="loai : ${danhSachLoaiPhong}"
                            th:value="${loai}"
                            th:text="${loai}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('loaiPhong')}"
                     th:errors="*{loaiPhong}"></div>
            </div>

            <div class="form-group">
                <label>Trạng Thái</label>
                <select th:field="*{trangThai}" required>
                    <option value="">-- Chọn trạng thái --</option>
                    <option th:each="tt : ${danhSachTrangThai}"
                            th:value="${tt}"
                            th:text="${tt}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('trangThai')}"
                     th:errors="*{trangThai}"></div>
            </div>

            <div style="margin-top: 25px;">
                <button type="submit" class="btn-submit">💾 Lưu Phòng</button>
                <a th:href="@{/khachhang/phong}" class="btn-back">Hủy bỏ</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
