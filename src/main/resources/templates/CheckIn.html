<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nhận Phòng (Check-in) - Quản Lý Khách Sạn</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9fa;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            color: #5c5055;
        }

        .sidebar {
            width: 260px;
            background-color: #fde2e4;
            color: #6b4c58;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 40px;
            color: #593945;
        }

        .sidebar a {
            color: #6b4c58;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #ff758c;
            color: white;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 26px;
            color: #593945;
            margin: 0;
            font-weight: 700;
        }

        .card-container {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6);
            border: 1px solid #fae1dd;
            margin-top: 25px;
            max-width: 820px;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #593945;
            font-size: 14px;
        }

        .form-control {
            padding: 11px 14px;
            border: 1px solid #f2cfd4;
            border-radius: 12px;
            font-size: 14px;
            color: #5c5055;
            background-color: #fffdfd;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #ff758c;
            box-shadow: 0 0 0 3px rgba(255, 117, 140, 0.15);
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #ff758c;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        .btn-primary:hover {
            background-color: #ff5c77;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #fff0f3;
            color: #6b4c58;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #fae1dd;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: #fde2e4;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: auto;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        /* NÚT ĐĂNG XUẤT */
        .nut-dang-xuat{
            margin-top: auto;
            color: #ff4d6d;
        }
        .sidebar a.nut-dang-xuat {
            margin-top: auto;
            color: #ff4d6d;
        }

        .sidebar a.nut-dang-xuat:hover {
            color: white;
            background-color: #ff758c;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🌸 KÊNH LỄ TÂN</h2>
    <a th:href="@{/letan/dashboard}">🏠 Trang chủ Lễ tân</a>
    <a th:href="@{/khachhang/danhsach}">👥 Quản lý Khách hàng</a>
    <a th:href="@{/khachhang/phong}">🛏️ Quản lý Phòng</a>
    <a th:href="@{/checkin}" class="active">🛎️ Nhận phòng (Check-in)</a>
    <a th:href="@{/dich-vu}">🧾 Quản lý Dịch vụ</a>
    <a th:href="@{/hoadon/danhsach}">🧾 Quản lý Hóa đơn</a>
    <a th:href="@{/dang-nhap}" class="nut-dang-xuat">Đăng xuất</a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="header-title">
        <h1>Nhận Phòng (Check-in)</h1>
        <a th:href="@{/khachhang/phong}" class="btn-secondary">← Quay lại danh sách phòng</a>
    </div>

    <div class="card-container">
        <div th:if="${param.success}" class="alert-success">
            ✅ Đã lưu thông tin nhận phòng và cập nhật trạng thái phòng thành công!
        </div>

        <form th:action="@{/checkin/save}" th:object="${datPhong}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="khachHang">Khách hàng</label>
                    <select id="khachHang" class="form-control" th:field="*{khachHang.maKhachHang}" required>
                        <option value="">-- Chọn khách hàng --</option>
                        <option th:each="kh : ${listKhachHang}"
                                th:value="${kh.maKhachHang}"
                                th:text="${kh.maHienThi} + ' - ' + ${kh.hoTen} + ' (' + ${kh.soDienThoai} + ')'">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="soPhong">Phòng còn trống</label>
                    <select id="soPhong" class="form-control" th:field="*{soPhong}" required>
                        <option value="" disabled selected>-- Chọn số phòng --</option>
                        <option th:each="sp : ${listPhongTrong}"
                                th:value="${sp}"
                                th:text="'Phòng ' + ${sp}"
                                th:selected="${soPhongDaChon != null and sp.toString() == soPhongDaChon.toString()}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ngayNhanPhong">Ngày nhận phòng</label>
                    <input type="datetime-local" id="ngayNhanPhong" class="form-control" th:field="*{ngayNhanPhong}" required>
                </div>

                <div class="form-group">
                    <label for="ngayTraPhong">Ngày trả phòng dự kiến</label>
                    <input type="datetime-local" id="ngayTraPhong" class="form-control" th:field="*{ngayTraPhong}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Xác nhận nhận phòng</button>
                <a th:href="@{/checkin}" class="btn-secondary">Làm mới</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
