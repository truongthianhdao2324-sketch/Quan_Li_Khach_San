<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Nhân Viên Mới - Quản Trị Viên</title>
    <style>
        /* --- RESET & STYLE CHUNG --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9fa;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #5c5055;
        }

        /* --- SIDEBAR QUẢN TRỊ VIÊN --- */
        .sidebar {
            width: 260px;
            background-color: #fde2e4;
            color: #6b4c58;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 40px;
            color: #593945;
        }

        .sidebar a {
            color: #6b4c58;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #ff758c;
            color: white;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title h1 {
            font-size: 26px;
            color: #593945;
            margin: 0;
            font-weight: 700;
        }

        .form-card {
            max-width: 760px;
            background-color: #ffffff;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6);
            border: 1px solid #fae1dd;
            margin-top: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #593945;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid #fae1dd;
            font-size: 14px;
            color: #5c5055;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff758c;
            box-shadow: 0 0 0 3px rgba(255, 117, 140, 0.2);
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-submit {
            background-color: #ff758c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: #ff5c77;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background-color: #fff0f3;
            color: #6b4c58;
            border: 1px solid #fae1dd;
            padding: 11px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: #ffe5ec;
            color: #ff5c77;
        }
    </style>
</head>
<body>

<!-- SIDEBAR QUẢN TRỊ -->
<div class="sidebar">
    <h2>👑 QUẢN TRỊ VIÊN</h2>
    <a th:href="@{/admin/dashboard}">📊 Thống kê doanh thu</a>
    <a th:href="@{/admin/khachhang/danhsach}">🧑‍🤝‍🧑 Quản lý Khách hàng</a>
    <a th:href="@{/admin/nhanvien}" class="active">👥 Quản lý Nhân sự</a>
    <a th:href="@{/admin/hoadon}">🧾 Quản lý Hóa Đơn</a>
    <a th:href="@{/dang-nhap}" style="margin-top: auto; color: #ff4d6d;">Đăng xuất</a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="header-title">
        <h1>Thêm Nhân Viên Mới</h1>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/nhanvien/them}" th:object="${nhanVien}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label>Họ và Tên <span style="color: #ff4d6d;">*</span></label>
                    <input type="text" th:field="*{hoTen}" required placeholder="Nhập họ tên nhân viên...">
                </div>

                <div class="form-group">
                    <label>Số CCCD <span style="color: #ff4d6d;">*</span></label>
                    <input type="text" th:field="*{soCccd}" required placeholder="Nhập số CCCD (12 chữ số)...">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Tuổi <span style="color: #ff4d6d;">*</span></label>
                    <input type="number" th:field="*{tuoi}" min="18" max="65" required placeholder="VD: 25">
                </div>

                <div class="form-group">
                    <label>Giới Tính</label>
                    <select th:field="*{gioiTinh}">
                        <option value="Nữ">Nữ</option>
                        <option value="Nam">Nam</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Vị Trí Công Việc <span style="color: #ff4d6d;">*</span></label>
                    <select th:field="*{viTriCongViec}">
                        <option value="Lễ Tân">Lễ Tân</option>
                        <option value="Quản Lý">Quản Lý</option>
                        <option value="Buồng Phòng">Buồng Phòng</option>
                        <option value="Kế Toán">Kế Toán</option>
                        <option value="Thu Ngân">Thu Ngân</option>
                        <option value="Bảo Vệ">Bảo Vệ</option>
                        <option value="Bếp Trưởng">Bếp Trưởng</option>
                        <option value="Pha Chế">Pha Chế</option>
                        <option value="Phục Vụ">Phục Vụ</option>
                        <option value="Kỹ Thuật">Kỹ Thuật</option>
                        <option value="Quản Lý Kho">Quản Lý Kho</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mức Lương (VNĐ) <span style="color: #ff4d6d;">*</span></label>
                    <input type="number" th:field="*{luong}" step="100000" min="0" required placeholder="VD: 8500000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Số Điện Thoại <span style="color: #ff4d6d;">*</span></label>
                    <input type="text" th:field="*{soDienThoai}" required placeholder="VD: 0987654321">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="VD: nhanvien@hotel.com">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">💾 Lưu Nhân Viên</button>
                <a th:href="@{/admin/nhanvien}" class="btn-cancel">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
