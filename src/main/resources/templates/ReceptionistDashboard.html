<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ Lễ Tân - Quản Lý Khách Sạn</title>

    <style>
        /* --- RESET & STYLE CHUNG --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9fa;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #5c5055;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: #fde2e4;
            color: #6b4c58;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 15px rgba(253, 226, 228, 0.4);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 19px;
            text-align: center;
            margin-bottom: 40px;
            color: #593945;
        }

        .sidebar a {
            color: #6b4c58;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #ff758c;
            color: white;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title h1 {
            font-size: 26px;
            color: #593945;
            margin: 0;
            font-weight: 700;
        }

        .card-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(250, 225, 221, 0.6);
            border: 1px solid #fae1dd;
            margin-top: 25px;
        }

        /* --- KHU VỰC THỐNG KÊ (STATS GRID) --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #fff0f3;
            border: 1px solid #fae1dd;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(250, 225, 221, 0.3);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #8c737f;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #ff758c;
        }

        /* --- KHU VỰC TÁC VỤ NHANH --- */
        .quick-actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #fae1dd;
        }

        .quick-actions h3 {
            color: #593945;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            background-color: #ff758c;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background-color: #ff5c77;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: white;
            color: #6b4c58;
            border: 1px solid #fae1dd;
        }

        .btn-secondary:hover {
            background-color: #fff0f3;
            color: #ff758c;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🌸 KÊNH LỄ TÂN</h2>
    <a th:href="@{/dich-vu}">Dịch vụ khách sạn</a>
    <a th:href="@{/letan/dashboard}" class="active">🏠 Trang chủ Lễ tân</a>
    <a th:href="@{/khachhang/danhsach}">👥 Quản lý Khách hàng</a>
    <a th:href="@{/khachhang/phong}">🛏️ Quản lý Phòng</a>
     <a th:href="@{/hoadon/danhsach}">🧾 Quản lý Hóa đơn</a>
    <a th:href="@{/dang-nhap}" style="margin-top: auto; color: #ff4d6d;">Đăng xuất</a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="header-title">
        <h1>Trang Chủ Quản Lý Lễ Tân</h1>
    </div>

    <div class="card-container">

        <!-- CÁC Ô THỐNG KÊ (Chỉ là giao dien thoi nha )-->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Tổng Số Phòng</h3>
                <div class="number">12</div>
            </div>
            <div class="stat-card">
                <h3>Phòng Còn Trống</h3>
                <div class="number" style="color: #2e7d32;">5</div>
            </div>
            <div class="stat-card">
                <h3>Phòng Đang Có Khách</h3>
                <div class="number" style="color: #c62828;">6</div>
            </div>

        </div>



    </div>

</div>

</body>
</html>
